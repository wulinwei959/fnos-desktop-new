name: CI

# 触发：推送到 main、提 PR、手动触发；忽略纯文档改动
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── 编译 + 单元测试：跑在 Linux nas-runner（标签 ubuntu-latest）──
  build-test:
    name: 编译与单元测试
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # 编译/单测不需要 Electron 运行二进制，加速
      GOPROXY: 'https://goproxy.cn,direct'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 准备 Go
        uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 编译 Go 代理（校验可编译）
        working-directory: src/modules/proxy
        run: go build ./...
      - name: TypeScript 编译
        run: npm run compile
      - name: 运行单元测试
        run: node --test --test-concurrency=1 tests/*.test.cjs

  # ── Windows 安装包构建：需要一台带 windows 标签的 act-runner（建议在你的 Win11 上注册）──
  # 仅在打 tag（v*）或手动触发时跑，不影响 push main 的 build-test。
  # 若你的 Windows runner 用了别的标签，把 runs-on 改成对应标签。
  package-win:
    name: 构建 Windows 安装包 (x64)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      GOPROXY: 'https://goproxy.cn,direct'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 准备 Go
        uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: 安装依赖（含 Electron 二进制）
        run: npm install --no-audit --no-fund
      - name: 装配 mpv（Windows runner 本机若有 fnOS Desktop 会自动复用）
        run: node scripts/setup-mpv.mjs --auto
        continue-on-error: true
      - name: 编译 Go 代理 + TypeScript + electron-builder 打包
        run: npm run build:win
      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-desktop-win-x64
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
