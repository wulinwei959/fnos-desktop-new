name: CI

# 触发：推送到 main、提 PR、或手动触发；忽略纯文档改动
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: 编译与单元测试
    # 匹配 nas-runner 的标签（见 Gitea → 站点管理 → 操作 → 运行器）。
    # 若换/加 runner，改这里即可。
    runs-on: ubuntu-latest
    env:
      # 编译/单测不需要 Electron 运行二进制，跳过下载以加速
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Go 模块代理（国内 runner 加速；海外可删）
      GOPROXY: 'https://goproxy.cn,direct'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 编译 Go 代理（校验可编译）
        working-directory: src/modules/proxy
        run: go build ./...

      - name: TypeScript 编译
        run: npm run compile

      - name: 运行单元测试
        run: node --test tests/*.test.cjs

  # 说明：Windows 安装包构建（electron-builder --win）需一台带 windows 标签的
  # gitea-runner；当前仅有 Linux runner，故未启用。将来加了 Windows runner 再补该 job。
