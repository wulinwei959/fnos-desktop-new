name: CI

# 触发：推送到 main、提 PR、或手动触发；忽略纯文档改动
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: 编译与单元测试
    # ⚠️ 改成你 gitea-runner 实际注册的标签：
    #   Linux runner 用 ubuntu-latest；Windows runner 用 windows-latest；
    #   自定义标签见 Gitea → 站点管理 → 操作(Actions) → 运行器(Runners)
    runs-on: ubuntu-latest
    env:
      # 编译/单测不需要 Electron 运行二进制，跳过下载以加速（打包 job 里再装）
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Go 模块代理（国内 runner 加速；海外可删）
      GOPROXY: 'https://goproxy.cn,direct'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 编译 Go 代理（校验可编译）
        working-directory: src/modules/proxy
        run: go build ./...

      - name: TypeScript 编译
        run: npm run compile

      - name: 运行单元测试
        run: node --test tests/*.test.cjs

  # 可选：Windows 安装包构建（需 Windows runner + 能装 Electron 二进制 + mpv）
  # 默认只在打 tag 或手动触发时跑；把 runs-on 换成你的 Windows runner 标签后取消注释
  package-win:
    if: ${{ false }}   # 暂不启用；需要出安装包时改成 startsWith(github.ref, 'refs/tags/')
    name: 构建 Windows 安装包 (x64)
    runs-on: windows-latest
    env:
      GOPROXY: 'https://goproxy.cn,direct'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: npm install --no-audit --no-fund
      - name: 装配 mpv（本机无则需自备镜像源）
        run: node scripts/setup-mpv.mjs --auto || echo "未找到本机 mpv，打包出的包将不含 mpv"
      - name: 构建 Go 代理 + 编译 + 打包
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: fnos-desktop-win
          path: release/*.exe
