<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>连接服务器 - fnOS 桌面</title>
    <link rel="stylesheet" href="./server.css" />
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="./image/fnos-logo.png" alt="fnOS" />
            <div class="logo-title">连接你的 NAS</div>
        </div>
        <div class="form-group">
            <label for="domain">服务器地址（IP / 域名 / FN ID）</label>
            <input type="text" id="domain" placeholder="例如 192.168.1.100:5666 或 nas.example.com" spellcheck="false" autofocus />
            <div id="domainError" class="error-msg" style="display:none;">请正确填写 IPV4、IPV6、域名或 FN ID（6-30 位，不含点号）</div>
        </div>
        <div id="fnidFields" style="display:none;">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入 fnOS 用户名" spellcheck="false" autocomplete="off" />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" spellcheck="false" autocomplete="off" />
            </div>
            <div class="form-group">
                <label for="accessCode">访问码（可选）</label>
                <input type="password" id="accessCode" placeholder="服务器未启用访问码时请留空" spellcheck="false" autocomplete="off" />
            </div>
        </div>
        <div class="switch-container">
            <label class="switch">
                <input type="checkbox" id="httpsSwitch" />
                <span class="slider"></span>
            </label>
            <span class="switch-label">HTTPS 安全访问</span>
        </div>
        <button class="login-btn" id="nextBtn" disabled>前往登录</button>
        <div class="hint">账号、密码与二次动态码将在飞牛官方登录页完成。</div>
    </div>
    <script src="./server.js"></script>
</body>
</html>
